version: 2
updates:
  # GitHub Actions 每周检查一次更新
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: "chore"
  # 依赖清单就绪后（出现 package.json / pyproject.toml）追加对应生态：
  # - package-ecosystem: npm
  #   directory: "/"
  #   schedule: { interval: weekly }
  # - package-ecosystem: pip
  #   directory: "/"
  #   schedule: { interval: weekly }
