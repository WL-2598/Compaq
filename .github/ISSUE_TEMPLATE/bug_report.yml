name: Bug 报告
description: 报告一个问题
labels: ["bug", "triage"]
body:
  - type: input
    id: version
    attributes:
      label: 版本号
      placeholder: "v1.2.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最小复现路径
      placeholder: |
        1. 运行 …
        2. 执行 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / 实际行为
  - type: textarea
    id: env
    attributes:
      label: 运行环境（系统、硬件、依赖版本）
      placeholder: "例如：Debian 12 / 旧款 ThinkPad X220 / Python 3.11"
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复报告
          required: true
        - label: 这不是安全漏洞（安全问题请按 SECURITY.md 私下上报）
          required: true
