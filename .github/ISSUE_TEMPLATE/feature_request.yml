name: 功能请求
description: 提出一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你遇到的场景或痛点，而不是直接跳到方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      placeholder: "我希望康柏能够 …"
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      placeholder: "我也考虑过 …"
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我理解社区版承诺"功能只增不减"，本请求不会要求删减现有功能
          required: true
