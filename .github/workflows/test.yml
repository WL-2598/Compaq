name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    # 固定 24.04：ubuntu-latest（26.04）暂无 Python 3.9 构建（setup-python 版本清单）
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 单元与集成测试
        run: python -m unittest discover -s tests -v
      - name: 5 分钟演示冒烟
        run: python -m compaq demo --frames 60 --no-color
      - name: 插件注册表校验
        run: python -m compaq registry validate
      - name: 环境自检
        run: python -m compaq doctor
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 构建 sdist/wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: 安装并验证入口
        run: |
          python -m pip install dist/*.whl
          compaq version
