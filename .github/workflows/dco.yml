name: DCO
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" | grep -q "^Signed-off-by: "; then
              echo "::error::提交 $sha 缺少 Signed-off-by。请执行: git commit --amend -s --no-edit 后强推"
              missing=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..HEAD")
          if [ "$missing" -eq 0 ]; then
            echo "所有提交均带有 sign-off ✔"
          fi
          exit "$missing"
